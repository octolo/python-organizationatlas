[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-organizationatlas"
version = "0.2.3"
description = "Django integration for organization information lookup and enrichment"
readme = "README.md"
authors = [
  { name = "Octolo", email = "dev@octolo.tech" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["django", "organization", "enrichment", "lookup"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Django>=5.0",
  "Pillow>=9.2",
  "python-organizationatlas>=0.2.2",
  "django-providerkit>=1.1.1",
  "django-virtualqueryset>=1.0.1",
  "django-boosted>=1.1.0",
  "django-geoaddress>=1.2.0",
  "django-namedid>=1.3.1",
  # 3.13 requires Django>=5.2 and assigns Field.unique, which is read-only before 5.1.
  "django-simple-history>=3.7,<3.13",
  "sqlparse>=0.6.0",
]

[project.optional-dependencies]
celery = ["celery>=5"]
rq = ["django-rq>=2"]
test = [
  "django-stubs>=5.0",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-django>=4.8",
]

[project.urls]
Homepage = "https://github.com/hicinformatic/python-organizationatlas"
Repository = "https://github.com/hicinformatic/python-organizationatlas"
Documentation = "https://github.com/hicinformatic/python-organizationatlas/tree/main/django-organizationatlas#readme"
Issues = "https://github.com/hicinformatic/python-organizationatlas/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_organizationatlas*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
django_organizationatlas = ["templates/**/*", "fixtures/**/*.csv"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["src/django_organizationatlas/migrations/"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[[tool.mypy.overrides]]
module = ["django_organizationatlas.admin.*"]
disable_error_code = ["misc", "attr-defined"]

[[tool.mypy.overrides]]
module = [
  "django_organizationatlas.helpers.source",
  "django_organizationatlas.models.data",
  "django_organizationatlas.models.source",
]
disable_error_code = ["misc", "attr-defined", "assignment"]
