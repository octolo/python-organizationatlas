[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-organizationatlas"
version = "0.2.0"
description = "Django integration for organization information lookup and enrichment"
readme = "README.md"
authors = [
  { name = "Octolo", email = "dev@octolo.tech" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["django", "organization", "enrichment", "lookup"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Django>=5.0",
  "python-organizationatlas>=0.2.0",
  "django-providerkit>=1.1.1",
  "django-virtualqueryset>=1.0.0",
  "django-boosted>=1.0.4",
  "django-geoaddress>=1.0.3",
  "django-namedid>=1.2.0",
  "django-simple-history>=3.7",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-django>=4.8",
]

[project.urls]
Homepage = "https://github.com/hicinformatic/python-organizationatlas"
Repository = "https://github.com/hicinformatic/python-organizationatlas"
Documentation = "https://github.com/hicinformatic/python-organizationatlas/tree/main/django-organizationatlas#readme"
Issues = "https://github.com/hicinformatic/python-organizationatlas/issues"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_organizationatlas*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
django_organizationatlas = ["templates/**/*", "data_sources/*.csv", "fixtures/europe/france/*.csv"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["src"]
